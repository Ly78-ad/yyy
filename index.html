<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TechBlog | 个人技术博客</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600;700&family=Orbitron:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark-dimmed.min.css">
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    
    :root {
      --bg: #0a0a0f;
      --surface: #12121a;
      --card: #1a1a2e;
      --border: #2a2a40;
      --primary: #00f0ff;
      --secondary: #8b5cf6;
      --accent: #ff006e;
      --text: #e0e0e0;
      --muted: #6b7280;
      --success: #00ff88;
    }

    html { scroll-behavior: smooth; overflow-x: hidden; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Inter', system-ui, sans-serif;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }

    ::selection { background: rgba(0, 240, 255, 0.3); color: #fff; }
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: var(--surface); }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--primary); }

    a { color: var(--primary); text-decoration: none; cursor: pointer; }
    a:hover { text-decoration: underline; }

    .container { max-width: 1200px; margin: 0 auto; padding: 0 1rem; }

    /* Navbar */
    .navbar {
      position: fixed; top: 0; left: 0; right: 0; z-index: 50;
      transition: all 0.3s;
    }
    .navbar.scrolled {
      background: rgba(10, 10, 15, 0.9);
      backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--border);
      box-shadow: 0 4px 20px rgba(0, 240, 255, 0.05);
    }
    .nav-inner {
      max-width: 1200px; margin: 0 auto; padding: 0 1rem;
      display: flex; align-items: center; justify-content: space-between;
      height: 64px;
    }
    .logo { display: flex; align-items: center; gap: 8px; color: var(--text); font-family: 'Orbitron', sans-serif; font-weight: 700; font-size: 1.1rem; letter-spacing: 0.1em; }
    .logo-icon {
      width: 32px; height: 32px; border-radius: 8px;
      background: rgba(0, 240, 255, 0.2); border: 1px solid rgba(0, 240, 255, 0.4);
      display: flex; align-items: center; justify-content: center;
      color: var(--primary); font-size: 0.75rem; font-weight: 700;
    }
    .logo span { color: var(--primary); }
    .nav-links { display: flex; gap: 4px; }
    .nav-link {
      padding: 8px 16px; border-radius: 8px; font-size: 0.875rem; font-weight: 500;
      color: var(--muted); transition: all 0.3s; letter-spacing: 0.05em;
      border: 1px solid transparent;
    }
    .nav-link:hover { color: var(--primary); background: rgba(0, 240, 255, 0.05); text-decoration: none; }
    .nav-link.active {
      color: var(--primary); background: rgba(0, 240, 255, 0.1);
      border: 1px solid rgba(0, 240, 255, 0.3);
    }

    .hamburger { display: none; padding: 8px; border-radius: 8px; background: none; border: none; color: var(--muted); cursor: pointer; }
    .hamburger svg { width: 24px; height: 24px; }
    .mobile-menu { display: none; background: rgba(18, 18, 26, 0.95); backdrop-filter: blur(20px); border-bottom: 1px solid var(--border); padding: 12px 16px; }
    .mobile-menu .nav-link { display: block; padding: 10px 16px; }

    @media (max-width: 768px) {
      .nav-links { display: none; }
      .hamburger { display: block; }
      .mobile-menu.open { display: block; }
    }

    /* Glass Card */
    .glass-card {
      background: rgba(26, 26, 46, 0.6);
      backdrop-filter: blur(12px);
      border: 1px solid var(--border);
      border-radius: 12px;
      transition: all 0.3s;
    }
    .glass-card:hover {
      border-color: rgba(0, 240, 255, 0.4);
      box-shadow: 0 0 20px rgba(0, 240, 255, 0.1), 0 0 40px rgba(0, 240, 255, 0.05);
      transform: translateY(-4px);
    }

    /* Buttons */
    .btn {
      display: inline-flex; align-items: center; gap: 8px;
      padding: 10px 24px; border-radius: 8px; font-size: 0.875rem; font-weight: 500;
      letter-spacing: 0.1em; text-transform: uppercase; cursor: pointer;
      border: 1px solid rgba(0, 240, 255, 0.5); color: var(--primary);
      background: transparent; transition: all 0.3s;
      text-shadow: 0 0 8px rgba(0, 240, 255, 0.3); text-decoration: none;
    }
    .btn:hover { background: rgba(0, 240, 255, 0.1); border-color: var(--primary); text-decoration: none; }
    .btn-primary { background: rgba(0, 240, 255, 0.1); box-shadow: 0 0 15px rgba(0, 240, 255, 0.2); }
    .btn-secondary { border-color: rgba(139, 92, 246, 0.5); color: var(--secondary); }
    .btn-secondary:hover { background: rgba(139, 92, 246, 0.1); border-color: var(--secondary); }

    /* Tags */
    .tag {
      display: inline-block; padding: 4px 12px; font-size: 0.75rem; border-radius: 9999px;
      background: rgba(0, 240, 255, 0.1); color: var(--primary);
      border: 1px solid rgba(0, 240, 255, 0.2);
    }
    .tag-sm { padding: 2px 8px; font-size: 0.7rem; }

    /* Section Title */
    .section-title {
      font-size: 1.875rem; font-weight: 700; font-family: 'Orbitron', sans-serif;
      letter-spacing: 0.05em; margin-bottom: 2rem; position: relative; display: inline-block;
    }
    .section-title::after {
      content: ''; position: absolute; bottom: -4px; left: 0; width: 100%; height: 2px;
      background: linear-gradient(90deg, var(--primary), transparent);
    }

    /* Gradient Text */
    .gradient-text {
      background: linear-gradient(135deg, #00f0ff, #8b5cf6, #ff006e);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    /* Glow Line */
    .glow-line {
      height: 1px; opacity: 0.3;
      background: linear-gradient(90deg, transparent, #00f0ff, #8b5cf6, transparent);
    }

    /* Hero */
    .hero {
      min-height: 90vh; display: flex; align-items: center; justify-content: center;
      position: relative; overflow: hidden;
    }
    .hero-bg {
      position: absolute; inset: 0;
      background-image:
        linear-gradient(rgba(0, 240, 255, 0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0, 240, 255, 0.03) 1px, transparent 1px);
      background-size: 50px 50px; opacity: 0.5;
    }
    .hero-circle {
      position: absolute; border-radius: 50%; filter: blur(80px);
    }
    .hero-circle-1 {
      top: 80px; left: 80px; width: 288px; height: 288px;
      background: rgba(0, 240, 255, 0.1); animation: float 6s ease-in-out infinite;
    }
    .hero-circle-2 {
      bottom: 80px; right: 80px; width: 384px; height: 384px;
      background: rgba(139, 92, 246, 0.1); animation: float 6s ease-in-out infinite -3s;
    }
    @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-20px); } }
    @keyframes fadeInUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes bounce { 0%, 100% { transform: translateY(0) translateX(-50%); } 50% { transform: translateY(-10px) translateX(-50%); } }

    .hero-content { position: relative; z-index: 10; text-align: center; max-width: 800px; padding: 0 1rem; }
    .hero-avatar {
      width: 128px; height: 128px; border-radius: 50%;
      border: 2px solid rgba(0, 240, 255, 0.5);
      box-shadow: 0 0 30px rgba(0, 240, 255, 0.2);
      margin-bottom: 2rem; animation: fadeInUp 0.6s ease-out forwards;
    }
    .hero-name {
      font-size: 3rem; font-weight: 700; font-family: 'Orbitron', sans-serif;
      margin-bottom: 1rem; animation: fadeInUp 0.6s ease-out 0.1s forwards; opacity: 0;
    }
    @media (min-width: 768px) { .hero-name { font-size: 4rem; } }
    .hero-typing {
      font-size: 1.25rem; color: var(--muted); margin-bottom: 1.5rem;
      font-family: 'JetBrains Mono', monospace; color: var(--primary);
      animation: fadeInUp 0.6s ease-out 0.2s forwards; opacity: 0;
    }
    .hero-typing .cursor {
      border-right: 2px solid currentColor;
      animation: blink 0.75s step-end infinite;
    }
    @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
    .hero-bio {
      font-size: 1.1rem; color: var(--muted); max-width: 640px; margin: 0 auto 2rem;
      line-height: 1.8; animation: fadeInUp 0.6s ease-out 0.3s forwards; opacity: 0;
    }
    .hero-buttons {
      display: flex; flex-wrap: wrap; justify-content: center; gap: 1rem;
      animation: fadeInUp 0.6s ease-out 0.4s forwards; opacity: 0;
    }
    .hero-tags {
      margin-top: 3rem; display: flex; flex-wrap: wrap; justify-content: center; gap: 8px;
      animation: fadeInUp 0.6s ease-out 0.5s forwards; opacity: 0;
    }
    .scroll-indicator {
      position: absolute; bottom: 32px; left: 50%; transform: translateX(-50%);
      animation: bounce 2s ease-in-out infinite;
    }
    .scroll-indicator svg { width: 24px; height: 24px; color: var(--primary); }

    /* Grid Layouts */
    .grid-3 { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 1.5rem; }
    .grid-2 { display: grid; grid-template-columns: repeat(auto-fill, minmax(400px, 1fr)); gap: 2rem; }
    .grid-4 { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 1.5rem; }
    @media (max-width: 500px) { .grid-2, .grid-3 { grid-template-columns: 1fr; } }

    /* Article Card */
    .article-card { padding: 1.5rem; }
    .article-card-header { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; }
    .article-card-header .date { font-size: 0.75rem; color: var(--muted); font-family: 'JetBrains Mono', monospace; }
    .article-card-title {
      font-size: 1.125rem; font-weight: 600; margin-bottom: 12px; color: var(--text);
      transition: color 0.3s; display: -webkit-box; -webkit-line-clamp: 2;
      -webkit-box-orient: vertical; overflow: hidden;
    }
    .article-card:hover .article-card-title { color: var(--primary); }
    .article-card-summary {
      font-size: 0.875rem; color: var(--muted); margin-bottom: 1rem; line-height: 1.6;
      display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden;
    }
    .article-card-meta {
      display: flex; align-items: center; justify-content: space-between;
      font-size: 0.75rem; color: var(--muted);
    }
    .article-card-tags { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 12px; }

    /* Project Card */
    .project-card { overflow: hidden; }
    .project-card-cover {
      position: relative; height: 200px; overflow: hidden;
    }
    .project-card-cover img {
      width: 100%; height: 100%; object-fit: cover;
      transition: transform 0.5s;
    }
    .project-card:hover .project-card-cover img { transform: scale(1.1); }
    .project-card-cover .overlay {
      position: absolute; inset: 0;
      background: linear-gradient(to top, var(--bg), transparent);
    }
    .project-card-body { padding: 1.5rem; }
    .project-card-title { font-size: 1.125rem; font-weight: 600; margin-bottom: 8px; transition: color 0.3s; }
    .project-card:hover .project-card-title { color: var(--primary); }
    .project-card-desc { font-size: 0.875rem; color: var(--muted); margin-bottom: 1rem; line-height: 1.6; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .project-card-stack { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 12px; }
    .project-card-stack span {
      padding: 4px 8px; font-size: 0.7rem; border-radius: 4px;
      background: var(--surface); color: var(--muted);
    }
    .project-card-links { display: flex; gap: 12px; padding-top: 12px; border-top: 1px solid rgba(42, 42, 64, 0.5); }
    .project-card-links a { font-size: 0.8rem; }

    /* Stat Cards */
    .stat-card { padding: 1.5rem; text-align: center; }
    .stat-number { font-size: 1.875rem; font-weight: 700; margin-bottom: 0.5rem; }
    .stat-label { font-size: 0.875rem; color: var(--muted); }

    /* Page sections */
    .section { padding: 5rem 1rem; }
    .section-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 3rem; flex-wrap: wrap; gap: 1rem; }
    .section-subtitle { color: var(--muted); font-size: 1.1rem; }

    /* Filter bar */
    .filter-bar { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 2rem; }
    .filter-btn {
      padding: 8px 16px; border-radius: 8px; font-size: 0.875rem; font-weight: 500;
      background: var(--surface); color: var(--muted); border: 1px solid var(--border);
      cursor: pointer; transition: all 0.3s;
    }
    .filter-btn:hover { border-color: rgba(0, 240, 255, 0.3); color: var(--primary); }
    .filter-btn.active {
      background: rgba(0, 240, 255, 0.2); color: var(--primary);
      border-color: rgba(0, 240, 255, 0.4);
    }

    /* Search */
    .search-wrapper { position: relative; flex: 1; min-width: 200px; }
    .search-input {
      width: 100%; padding: 12px 12px 12px 40px; background: var(--surface);
      border: 1px solid var(--border); border-radius: 8px; color: var(--text);
      font-size: 0.875rem; outline: none; transition: border-color 0.3s;
    }
    .search-input::placeholder { color: var(--muted); }
    .search-input:focus { border-color: var(--primary); box-shadow: 0 0 0 2px rgba(0, 240, 255, 0.1); }
    .search-icon {
      position: absolute; left: 12px; top: 50%; transform: translateY(-50%);
      width: 16px; height: 16px; color: var(--muted);
    }

    /* Article Detail */
    .detail-header { margin-bottom: 2.5rem; }
    .back-link {
      display: inline-flex; align-items: center; gap: 8px; font-size: 0.875rem;
      color: var(--muted); margin-bottom: 2rem; transition: color 0.3s; cursor: pointer;
    }
    .back-link:hover { color: var(--primary); text-decoration: none; }
    .detail-title {
      font-size: 1.875rem; font-weight: 700; font-family: 'Orbitron', sans-serif;
      margin-bottom: 1.5rem;
    }
    @media (min-width: 768px) { .detail-title { font-size: 2.5rem; } }
    .detail-summary { font-size: 1.1rem; color: var(--muted); margin-bottom: 1.5rem; line-height: 1.8; }
    .detail-meta {
      display: flex; flex-wrap: wrap; gap: 1.5rem; font-size: 0.875rem; color: var(--muted);
      padding-bottom: 1.5rem; border-bottom: 1px solid rgba(42, 42, 64, 0.5);
    }
    .detail-tags { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 1rem; }

    /* Markdown Body */
    .markdown-body { color: var(--text); line-height: 1.8; }
    .markdown-body h1 { font-size: 1.875rem; font-weight: 700; margin: 2.5rem 0 1rem; color: var(--primary); }
    .markdown-body h2 { font-size: 1.5rem; font-weight: 700; margin: 2rem 0 0.75rem; color: var(--primary); }
    .markdown-body h3 { font-size: 1.25rem; font-weight: 600; margin: 1.5rem 0 0.5rem; color: var(--text); }
    .markdown-body p { margin-bottom: 1rem; line-height: 1.8; }
    .markdown-body a { color: var(--primary); }
    .markdown-body ul, .markdown-body ol { margin-bottom: 1rem; padding-left: 1.5rem; }
    .markdown-body li { margin-bottom: 0.25rem; }
    .markdown-body blockquote {
      border-left: 4px solid rgba(0, 240, 255, 0.5); padding: 4px 16px; margin: 1rem 0;
      background: rgba(0, 240, 255, 0.05); border-radius: 0 8px 8px 0;
    }
    .markdown-body code {
      background: var(--surface); padding: 2px 6px; border-radius: 4px;
      font-size: 0.875rem; font-family: 'JetBrains Mono', monospace; color: var(--primary);
    }
    .markdown-body pre {
      background: var(--surface); border-radius: 8px; padding: 1rem; margin: 1rem 0;
      overflow-x: auto; border: 1px solid var(--border);
    }
    .markdown-body pre code { background: transparent; padding: 0; color: inherit; }
    .markdown-body hr { border-color: var(--border); margin: 2rem 0; }
    .markdown-body table { width: 100%; border-collapse: collapse; margin: 1rem 0; }
    .markdown-body th, .markdown-body td { border: 1px solid var(--border); padding: 8px 16px; text-align: left; }
    .markdown-body th { background: var(--surface); font-weight: 600; }

    /* Article Footer */
    .article-footer { margin-top: 3rem; padding-top: 2rem; border-top: 1px solid rgba(42, 42, 64, 0.5); }
    .like-btn {
      display: inline-flex; align-items: center; gap: 8px; padding: 12px 24px;
      border-radius: 8px; border: 1px solid var(--border); background: transparent;
      color: var(--text); cursor: pointer; transition: all 0.3s; font-size: 0.9rem;
    }
    .like-btn:hover { border-color: var(--accent); background: rgba(255, 0, 110, 0.1); }
    .like-btn.liked { border-color: var(--accent); background: rgba(255, 0, 110, 0.2); color: var(--accent); }
    .share-bar { display: flex; justify-content: center; gap: 12px; margin-top: 1.5rem; }
    .share-btn { cursor: pointer; }
    .post-nav { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; margin-top: 2rem; }
    .post-nav a { padding: 1.25rem; font-size: 0.875rem; }
    .post-nav-label { font-size: 0.75rem; color: var(--muted); }
    .post-nav-title { margin-top: 4px; color: var(--text); transition: color 0.3s; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .post-nav a:hover .post-nav-title { color: var(--primary); text-decoration: none; }

    /* Resume */
    .resume-section { margin-bottom: 3rem; }
    .resume-section-title {
      font-size: 1.5rem; font-weight: 700; font-family: 'Orbitron', sans-serif;
      margin-bottom: 1.5rem; display: flex; align-items: center; gap: 12px;
    }
    .resume-section-icon {
      width: 32px; height: 32px; border-radius: 8px;
      display: flex; align-items: center; justify-content: center; font-size: 0.875rem;
    }
    .exp-item { padding: 1.5rem; position: relative; overflow: hidden; margin-bottom: 1.5rem; }
    .exp-item:not(:last-child)::after {
      content: ''; position: absolute; left: 32px; top: 64px; bottom: 0; width: 1px;
      background: linear-gradient(to bottom, rgba(0, 240, 255, 0.3), transparent);
    }
    .exp-header { display: flex; align-items: flex-start; gap: 12px; margin-bottom: 12px; }
    .exp-dot {
      width: 16px; height: 16px; border-radius: 50%;
      background: var(--primary); border: 2px solid var(--bg);
      box-shadow: 0 0 10px rgba(0, 240, 255, 0.5); flex-shrink: 0; margin-top: 4px;
    }
    .exp-period { font-size: 0.875rem; font-family: 'JetBrains Mono', monospace; color: var(--primary); }
    .exp-company { font-size: 1.125rem; font-weight: 600; }
    .exp-role { font-size: 1.125rem; font-weight: 600; color: var(--secondary); margin-bottom: 12px; }
    .exp-highlights { list-style: none; padding: 0; }
    .exp-highlights li {
      display: flex; align-items: flex-start; gap: 8px; font-size: 0.875rem;
      color: var(--muted); margin-bottom: 8px;
    }
    .exp-highlights li::before { content: '▸'; color: var(--primary); flex-shrink: 0; margin-top: 1px; }

    .edu-card { padding: 1.5rem; }
    .edu-period { font-size: 0.875rem; font-family: 'JetBrains Mono', monospace; color: var(--primary); margin-bottom: 8px; }
    .edu-school { font-size: 1.125rem; font-weight: 600; margin-bottom: 4px; }
    .edu-degree { font-size: 0.875rem; color: var(--muted); margin-bottom: 8px; }

    .skill-card { padding: 1.25rem; }
    .skill-category {
      font-size: 0.875rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.1em;
      color: var(--primary); margin-bottom: 12px; font-family: 'Orbitron', sans-serif;
    }
    .skill-items { display: flex; flex-wrap: wrap; gap: 8px; }
    .skill-item {
      padding: 6px 12px; font-size: 0.75rem; border-radius: 8px;
      background: var(--surface); color: var(--text); border: 1px solid var(--border);
      transition: all 0.3s;
    }
    .skill-item:hover { border-color: rgba(0, 240, 255, 0.3); color: var(--primary); }

    .cert-item { padding: 1rem; display: flex; align-items: center; gap: 12px; margin-bottom: 0.75rem; }

    /* Footer */
    footer { border-top: 1px solid var(--border); background: rgba(18, 18, 26, 0.5); }
    .footer-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 2rem; }
    .footer-title { font-family: 'Orbitron', sans-serif; font-size: 0.875rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.1em; margin-bottom: 1rem; }
    .footer-links { display: flex; flex-direction: column; gap: 8px; }
    .footer-links a { font-size: 0.875rem; color: var(--muted); }
    .footer-links a:hover { color: var(--primary); }
    .footer-bottom { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 1rem; font-size: 0.875rem; color: var(--muted); padding-top: 2rem; }
    .footer-bottom .tech { font-family: 'JetBrains Mono', monospace; font-size: 0.75rem; }

    /* Back to top */
    .back-to-top {
      position: fixed; bottom: 32px; right: 32px; z-index: 40;
      width: 48px; height: 48px; border-radius: 12px;
      background: rgba(18, 18, 26, 0.8); backdrop-filter: blur(12px);
      border: 1px solid var(--border); color: var(--primary);
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; transition: all 0.3s; opacity: 0; pointer-events: none;
    }
    .back-to-top.visible { opacity: 1; pointer-events: auto; }
    .back-to-top:hover { border-color: rgba(0, 240, 255, 0.5); box-shadow: 0 0 20px rgba(0, 240, 255, 0.2); transform: translateY(-4px); }

        content:'# Vue 3 Composition API 深度解析与实战指南\n\n## 前言\n\nVue 3 引入的 Composition API 是 Vue 框架发展的一个重要里程碑。\n\n## 为什么需要 Composition API？\n\n- **逻辑分散**：同一个功能的代码被分散在不同的选项中\n- **复用困难**：Mixin 存在命名冲突和来源不明确的问题\n- **类型推导**：Options API 对 TypeScript 的支持不够友好\n\n## 核心概念\n\n### ref 与 reactive\n\n```javascript\nimport { ref, reactive } from \'vue\'\nconst count = ref(0)\nconsole.log(count.value) // 0\nconst state = reactive({ name: \'Vue 3\', version: 3 })\nconsole.log(state.name) // Vue 3\n```\n\n### computed 计算属性\n\n```javascript\nimport { ref, computed } from \'vue\'\nconst firstName = ref(\'John\')\nconst lastName = ref(\'Doe\')\nconst fullName = computed(() => `${firstName.value} ${lastName.value}`)\n```\n\n## 总结\n\nComposition API 不仅是 Vue 3 的新特性，更是一种全新的代码组织思维方式。'

            <div style="display:flex;gap:1rem;margin-bottom:2rem;flex-wrap:wrap;">
              <div class="search-wrapper">
                <svg class="search-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
                <input type="text" class="search-input" placeholder="搜索文章..." id="articleSearch" value="${search}" oninput="onArticleFilter()">
              </div>
              <div class="filter-bar" style="margin:0;">
                ${categories.map(c => `<button class="filter-btn ${filterCat===c?'active':''}" onclick="onArticleCatClick('${c}')">${c}</button>`).join('')}
              </div>
            </div>
            ${filtered.length ? `
              <div class="grid-2">${filtered.map(a => renderArticleCard(a)).join('')}</div>
              <p style="text-align:center;margin-top:2rem;color:var(--muted);font-size:0.875rem;">共 ${filtered.length} 篇文章</p>
            ` : `
              <div style="text-align:center;padding:5rem 0;">
                <div style="font-size:4rem;margin-bottom:1rem;">🔍</div>
                <h3 style="font-size:1.25rem;margin-bottom:0.5rem;">未找到匹配的文章</h3>
                <p style="color:var(--muted);">尝试调整搜索关键词或筛选条件</p>
              </div>
            `}
          </div>
        </div>
      `;
      observeAnimations();
    }

    let currentArticleCat = '';
    function onArticleCatClick(cat) {
      currentArticleCat = currentArticleCat === cat ? '' : cat;
      const search = document.getElementById('articleSearch')?.value || '';
      renderArticles(currentArticleCat, search);
    }
    function onArticleFilter() {
      const search = document.getElementById('articleSearch')?.value || '';
      renderArticles(currentArticleCat, search);
    }

    function renderArticleDetail(id) {
      const a = articles.find(x => x.id === id);
      if (!a) { render404(); return; }
      const idx = articles.indexOf(a);
      const prev = idx > 0 ? articles[idx-1] : null;
      const next = idx < articles.length-1 ? articles[idx+1] : null;
      const liked = likedArticles[id] || false;
      const currentLikes = a.likes + (liked ? 1 : 0);

      document.getElementById('page-article').innerHTML = `
        <div class="section">
          <div class="container" style="max-width: 800px;">
            <a href="#/articles" class="back-link">← 返回文章列表</a>
            <div class="detail-header">
              <div style="display:flex;align-items:center;gap:12px;margin-bottom:1rem;">
                <span class="tag">${a.category}</span>
                <span style="font-size:0.875rem;color:var(--muted);font-family:'JetBrains Mono',monospace;">${a.date}</span>
              </div>
              <h1 class="detail-title gradient-text">${a.title}</h1>
              <p class="detail-summary">${a.summary}</p>
              <div class="detail-meta">
                <span>⏱️ ${a.readTime}</span>
                <span>👀 ${a.views} 次阅读</span>
                <span>❤️ ${a.likes} 个赞</span>
              </div>
              <div class="detail-tags">${a.tags.map(t => `<span class="tag tag-sm">${t}</span>`).join('')}</div>
            </div>
            <article class="markdown-body" id="articleContent"></article>
            <div class="article-footer" style="text-align:center;">
              <button class="like-btn ${liked?'liked':''}" id="likeBtn" onclick="toggleLike('${id}')">
                ${liked ? '❤️' : '🤍'} ${liked ? '已点赞' : '点赞'} · ${currentLikes}
              </button>
              <div class="share-bar">
                <span class="tag share-btn" onclick="copyLink()">📋 复制链接</span>
              </div>
            </div>
            <div class="post-nav">
              ${prev ? `<a href="#/article/${prev.id}" class="glass-card"><span class="post-nav-label">← 上一篇</span><div class="post-nav-title">${prev.title}</div></a>` : '<div></div>'}
              ${next ? `<a href="#/article/${next.id}" class="glass-card" style="text-align:right;"><span class="post-nav-label">下一篇 →</span><div class="post-nav-title">${next.title}</div></a>` : ''}
            </div>
          </div>
        </div>
      `;

      // Render markdown with highlight.js
      const rendered = marked.parse(a.content);
      document.getElementById('articleContent').innerHTML = rendered;
      document.querySelectorAll('#articleContent pre code').forEach(block => {
        hljs.highlightElement(block);
      });
    }

    function toggleLike(id) {
      likedArticles[id] = !likedArticles[id];
      renderArticleDetail(id);
    }

    function copyLink() {
      navigator.clipboard?.writeText(window.location.href).then(() => alert('链接已复制'));
    }

    function renderProjects() {
      const featuredProjects = projects.filter(p => p.featured);
      document.getElementById('page-projects').innerHTML = `
        <div class="section">
          <div class="container">
            <div class="section-header">
              <div>
                <h1 class="section-title" style="font-size:2.5rem;">项目展示</h1>
                <p class="section-subtitle">个人项目与开源贡献</p>
              </div>
            </div>
            <div class="filter-bar">
              <button class="filter-btn" id="projectFilterBtn" onclick="toggleProjectFilter()">⭐ 仅显示精选</button>
            </div>
            <div class="grid-2" id="projectsGrid">${projects.map(p => renderProjectCard(p)).join('')}</div>
          </div>
        </div>
      `;
      observeAnimations();
    }

    let showFeaturedOnly = false;
    function toggleProjectFilter() {
      showFeaturedOnly = !showFeaturedOnly;
      const btn = document.getElementById('projectFilterBtn');
      if (btn) btn.classList.toggle('active', showFeaturedOnly);
      const grid = document.getElementById('projectsGrid');
      if (grid) {
        const list = showFeaturedOnly ? projects.filter(p => p.featured) : projects;
        grid.innerHTML = list.map(p => renderProjectCard(p)).join('');
        observeAnimations();
      }
    }

    function renderResume() {
      const skillLabels = { languages:'编程语言', frontend:'前端技术', backend:'后端框架', database:'数据库', devops:'DevOps', tools:'开发工具' };
      document.getElementById('page-resume').innerHTML = `
        <div class="section">
          <div class="container" style="max-width:900px;">
            <div class="section-header">
              <div>
                <h1 class="section-title" style="font-size:2.5rem;">个人简历</h1>
                <p class="section-subtitle">教育背景、工作经历与技能展示</p>
              </div>
            </div>

            <div class="glass-card anim" style="padding:2rem;margin-bottom:3rem;">
              <div style="display:flex;flex-wrap:wrap;align-items:center;gap:1.5rem;">
                <img src="${profile.avatar}" alt="${profile.name}" style="width:112px;height:112px;border-radius:50%;border:2px solid rgba(0,240,255,0.5);box-shadow:0 0 20px rgba(0,240,255,0.2);">
                <div>
                  <h2 class="gradient-text" style="font-size:1.875rem;font-family:'Orbitron',sans-serif;margin-bottom:0.5rem;">${profile.name}</h2>
                  <p style="color:var(--primary);font-size:1.25rem;margin-bottom:0.75rem;">${profile.title}</p>
                  <p style="color:var(--muted);margin-bottom:1rem;line-height:1.6;">${profile.bio}</p>
                  <div style="display:flex;flex-wrap:wrap;gap:1rem;font-size:0.875rem;color:var(--muted);">
                    <span>📧 ${profile.email}</span><span>📍 ${profile.location}</span><span>🟢 ${profile.availability}</span>
                  </div>
                </div>
              </div>
            </div>

            <div class="resume-section anim">
              <h2 class="resume-section-title"><span class="resume-section-icon" style="background:rgba(0,240,255,0.2);">💼</span> 工作经历</h2>
              ${resume.experience.map(exp => `
                <div class="glass-card exp-item">
                  <div class="exp-header">
                    <div class="exp-dot"></div>
                    <div>
                      <div class="exp-period">${exp.period}</div>
                      <div class="exp-company">${exp.company}</div>
                    </div>
                  </div>
                  <div class="exp-role">${exp.role}</div>
                  <ul class="exp-highlights">${exp.highlights.map(h => `<li>${h}</li>`).join('')}</ul>
                </div>
              `).join('')}
            </div>

            <div class="resume-section anim">
              <h2 class="resume-section-title"><span class="resume-section-icon" style="background:rgba(139,92,246,0.2);">🎓</span> 教育背景</h2>
              <div class="grid-2">
                ${resume.education.map(edu => `
                  <div class="glass-card edu-card">
                    <div class="edu-period">${edu.period}</div>
                    <div class="edu-school">${edu.school}</div>
                    <div class="edu-degree">${edu.degree}</div>
                    <span class="tag tag-sm">${edu.gpa}</span>
                  </div>
                `).join('')}
              </div>
            </div>

            <div class="resume-section anim">
              <h2 class="resume-section-title"><span class="resume-section-icon" style="background:rgba(255,0,110,0.2);">⚡</span> 技能专长</h2>
              <div class="grid-2">
                ${Object.entries(resume.skills).map(([key, items]) => `
                  <div class="glass-card skill-card">
                    <div class="skill-category">${skillLabels[key] || key}</div>
                    <div class="skill-items">${items.map(s => `<span class="skill-item">${s}</span>`).join('')}</div>
                  </div>
                `).join('')}
              </div>
            </div>

            <div class="resume-section anim">
              <h2 class="resume-section-title"><span class="resume-section-icon" style="background:rgba(0,255,136,0.2);">🛠️</span> 技术栈</h2>
              <div class="glass-card" style="padding:1.5rem;">
                <div style="display:flex;flex-wrap:wrap;gap:8px;justify-content:center;">
                  ${techStack.map(t => `<span class="tag">${t}</span>`).join('')}
                </div>
              </div>
            </div>

            <div class="resume-section anim">
              <h2 class="resume-section-title"><span class="resume-section-icon" style="background:rgba(107,114,128,0.2);">🏆</span> 认证证书</h2>
              ${resume.certifications.map(c => `<div class="glass-card cert-item"><span>🏅</span><span style="font-size:0.875rem;">${c}</span></div>`).join('')}
            </div>
          </div>
        </div>
      `;
      observeAnimations();
    }

    function render404() {
      document.getElementById('page-404').innerHTML = `
        <div class="not-found" style="text-align:center;padding:0 1rem;">
          <div>
            <div class="not-found-code"><span class="bg">404</span><span class="fg gradient-text">404</span></div>
            <h2 style="font-size:1.875rem;font-family:'Orbitron',sans-serif;margin:1.5rem 0 1rem;">页面未找到</h2>
            <p style="color:var(--muted);margin-bottom:2rem;">您访问的页面不存在或已被移除</p>
            <a href="#/" class="btn btn-primary">返回首页</a>
          </div>
        </div>
      `;
    }

    // ============ TYPING EFFECT ============
    const typingTexts = ['全栈开发工程师', 'Vue.js / React 专家', '云原生架构师', '开源爱好者'];
    let typeIdx = 0, charIdx = 0, isDeleting = false, typeTimer = null;
    function startTyping() {
      if (typeTimer) clearTimeout(typeTimer);
      typeIdx = 0; charIdx = 0; isDeleting = false;
      typeText();
    }
    function typeText() {
      const el = document.getElementById('typingText');
      if (!el) return;
      const current = typingTexts[typeIdx];
      if (!isDeleting) {
        el.textContent = current.substring(0, charIdx + 1);
        charIdx++;
        if (charIdx === current.length) {
          typeTimer = setTimeout(() => { isDeleting = true; typeText(); }, 2000);
          return;
        }
      } else {
        el.textContent = current.substring(0, charIdx - 1);
        charIdx--;
        if (charIdx === 0) { isDeleting = false; typeIdx = (typeIdx + 1) % typingTexts.length; }
      }
      typeTimer = setTimeout(typeText, isDeleting ? 50 : 100);
    }

    // ============ SCROLL ANIMATIONS ============
    let observer;
    function observeAnimations() {
      if (!observer) {
        observer = new IntersectionObserver(entries => {
          entries.forEach(e => { if (e.isIntersecting) { e.target.classList.add('visible'); observer.unobserve(e.target); } });
        }, { threshold: 0.1, rootMargin: '0px 0px -50px 0px' });
      }
      document.querySelectorAll('.anim:not(.visible)').forEach(el => observer.observe(el));
    }

    // ============ SCROLL EVENTS ============
    window.addEventListener('scroll', () => {
      const navbar = document.getElementById('navbar');
      const backToTop = document.getElementById('backToTop');
      navbar.classList.toggle('scrolled', window.scrollY > 20);
      backToTop.classList.toggle('visible', window.scrollY > 400);
    }, { passive: true });

    // ============ INIT ============
    renderNav();
    window.addEventListener('hashchange', navigate);
    navigate();
  </script>
</body>
</html>
